<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Monet Music Search</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="app-header">
    <div class="logo-area">
      <h1>Monet Music</h1>
    </div>
  
    <div id="user-area" class="user-area logged-out">
      <!-- Logged-out state -->
      <!-- <button id="login-btn" class="login-btn">Sign In</button> -->
  
      <!-- Logged-in state -->
      <div id="profile-box" class="profile-box hidden">
        <img id="profile-photo" class="profile-photo" src="" alt="User Photo">
        <span id="profile-name" class="profile-name"></span>
      </div>
    </div>
  </header>
  
  <div class="canvas">
    <h1 class="title">Monet Music Search</h1>
    <p class="subtitle">
      Soft colors, quiet mood—find an artist and a song to paint your playlist.
    </p>

    <form id="form">
      <div class="field-group">
        <label for="artist">Artist</label>
        <input type="text" id="artist" name="artist" placeholder="e.g. The Weeknd" />
      </div>

      <div class="field-group">
        <label for="song">Song name</label>
        <input type="text" id="song" name="song" placeholder="e.g. Blinding Lights" />
      </div>

      <div class="actions">
        <button id='submit-btn' type="submit">Search</button>
      </div>
    </form>
  </div>

  <div id="response-div" class="canvas">
    <h1 class="title">His / her releases: </h1>
    <div id="releases-div">
      <div id="blank-ph">No content</div>
      <!-- from js -->

    </div>
  </div>

  <div class="auth-card canvas">
    <h2>Welcome</h2>
    <form id="sign">
      <label for="u-name">ID</label>
      <input type="text" id="u-name" name="u-name" placeholder="Your name">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password">

      <button type="submit">Continue</button>
    </form>
  </div>

  <div class="auth-card canvas">
    <h2>Create New Account</h2>
    <form id="create-account">
      <label for="new-u-name">ID</label>
      <input type="text" id="new-u-name" name="new-u-name" placeholder="Choose a username">

      <label for="new-password">Password</label>
      <input type="password" id="new-password" name="new-password" placeholder="Choose a password">

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password">

      <button type="submit">Sign Up</button>
    </form>
  </div>



  <script type="module" src="scripts.js"></script>
</body>

</html>
